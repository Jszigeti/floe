name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: go test -race ./... -coverprofile=cover.out
      - run: go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); if ($3+0 < 90) {print "total coverage " $3 "% is below 90%"; exit 1} else print "total coverage " $3 "%"}'
  integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/floe/bin
          key: restic-${{ runner.os }}-${{ hashFiles('internal/restic/download.go') }}
      - run: go test -tags integration ./integration/ -v
  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/floe/bin
          key: restic-${{ runner.os }}-${{ hashFiles('internal/restic/download.go') }}
      - run: go test -tags e2e ./e2e/ -v -timeout 15m
