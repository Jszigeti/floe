version: 2
project_name: floe
builds:
  - main: ./cmd/floe
    goos: [darwin]
    goarch: [arm64, amd64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
release:
  draft: false
